<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrew Latchman: a CRM record built for the Operations Manager role at Connectd</title>
<meta name="description" content="An interactive CRM-style record that ties Andrew Latchman's CV to the Operations Manager job description: contact, tickets, dashboards and workflows.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html[data-theme="dark"]{--bg:#141f2b;--card:#1d2c3b;--line:#35485b;--line2:#2b3c4d;--soft:#263748;--text:#e6edf4;--sub:#9db2c7;--link:#62cde0;--teal:#5cc8c4;--nav:#0d1620;--navon:#14465a;--navonc:#7fdcec;color-scheme:dark}
:root{--navon:#e5f5f8;--navonc:#00748a;--bri:1;--nav:#2d3e50;--bg:#f5f8fa;--card:#fff;--line:#cbd6e2;--line2:#dfe3eb;--soft:#eaf0f6;--text:#33475b;--sub:#516f90;--link:#0091ae;--teal:#2b9fa0;--o:#ff7a59;--o2:#ff8f73;--od:#e8603f;--green:#00bda5;--amber:#f5c26b;--red:#f2545b;--purple:#8b85dd;
  --f:"Lexend Deca","Helvetica Neue",Helvetica,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.5;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--link);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
[hidden]{display:none!important}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
.top{height:48px;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 14px;position:sticky;top:0;z-index:50}
.logo{width:30px;height:30px;border-radius:50%;background:var(--o);display:grid;place-items:center;margin-right:10px;flex:none}
.logo::after{content:"";width:10px;height:10px;border-radius:50%;border:3px solid #fff}
.menu{display:flex;height:100%}
.menu a{color:#fff;font-size:13px;font-weight:500;padding:0 13px;display:flex;align-items:center;gap:5px;height:100%;border:0;background:none}
.menu a:hover{background:rgba(255,255,255,.1);text-decoration:none}.menu a.on{background:rgba(255,255,255,.16)}
.top .sp{flex:1}.tic{display:flex;gap:2px;align-items:center}
.tic button{background:none;border:0;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;position:relative}.tic button:hover{background:rgba(255,255,255,.12)}
.tic button[aria-expanded=true]{background:rgba(255,255,255,.18)}.tic .bd{position:absolute;right:3px;top:3px;background:var(--red);color:#fff;border-radius:50%;width:15px;height:15px;font-size:9px;display:grid;place-items:center}
.ava{width:30px;height:30px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;margin-left:8px}
.shell{display:flex;min-height:calc(100vh - 48px)}
.side{width:206px;background:var(--card);border-right:1px solid var(--line);padding:14px 10px;flex:none;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto}
.side h6{margin:6px 10px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:500}
.side a{display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:4px;color:var(--text);font-size:14px;font-weight:400;margin-bottom:2px}
.side a:hover{background:var(--bg);text-decoration:none}.side a.on{background:var(--navon);color:var(--navonc);font-weight:500;box-shadow:inset 3px 0 0 #00a4bd}
.side a .ct{margin-left:auto;font-size:12px;background:var(--soft);color:var(--sub);border-radius:10px;padding:0 8px}
.side .note{font-size:12px;color:var(--sub);margin:18px 10px 0;line-height:1.5;border-top:1px solid var(--line2);padding-top:12px}
.page{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:7px 14px;font-size:14px;font-weight:400;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--bg)}.btn:focus-visible,[data-a]:focus-visible{outline:2px solid #00a4bd;outline-offset:2px}
.btn.o{border-color:var(--o);color:var(--o)}.btn.o:hover{background:var(--card)4f1}
.btn.p{background:var(--o);border-color:var(--o);color:#fff}.btn.p:hover{background:var(--o2)}
.btn.g{background:var(--soft);border-color:var(--line)}.btn.sm{padding:4px 10px;font-size:13px}
.sel{border:1px solid #7fd1de;border-radius:3px;background:var(--card);color:var(--text);padding:7px 30px 7px 12px;font:inherit;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#0091ae 50%),linear-gradient(135deg,#0091ae 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer;max-width:260px}
.inp{border:1px solid var(--line);border-radius:3px;padding:8px 12px 8px 34px;font:inherit;background:var(--card);width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:3px;padding:1px 8px;font-size:12px;border:1px solid var(--line2);background:var(--soft);color:var(--text);white-space:nowrap}
.chip.g{background:#e6f9f6;border-color:#a6e7de;color:#007a6a}.chip.a{background:#fef6e6;border-color:#f6dcaa;color:#8a5a00}.chip.b{background:#eaf0ff;border-color:#c5d3f7;color:#3a55a8}.chip.o{background:var(--card)1ed;border-color:#ffc9bb;color:#b6442a}
/* contact record */
.rec{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;min-height:calc(100vh - 48px)}
.cl{background:var(--card);border-right:1px solid var(--line);padding:18px 20px}
.cr{background:var(--card);border-left:1px solid var(--line)}
.cm{padding:18px 22px;min-width:0}
.cl .back{display:flex;justify-content:space-between;font-size:13px;margin-bottom:14px}
.who{display:flex;gap:12px;align-items:center}
.av{width:60px;height:60px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:500;flex:none}
.who h1{margin:0;font-size:20px;font-weight:500;line-height:1.2}.who .t{color:var(--sub);font-size:13px}
.em{font-size:13px;margin:10px 0 14px;color:var(--text)}
.acts{display:flex;gap:10px;margin:0 0 18px}.acts button{border:0;background:var(--o);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px}.acts button:hover{background:var(--od)}
.cl h4{font-size:13px;font-weight:500;margin:0 0 10px;display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--text);border-bottom:1px solid var(--line2);padding:10px 0;margin-top:6px}
.prop{margin:0 0 14px}.prop b{display:block;font-weight:400;font-size:12px;color:var(--sub)}.prop span{font-size:14px;display:block;word-break:break-word}
.cl .bt{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.srch{position:relative;max-width:300px;flex:1}.srch svg{position:absolute;left:11px;top:11px;color:var(--link)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px}.tabs button{border:0;background:none;padding:10px 16px;font-size:14px;color:var(--text);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs button.on{border-bottom-color:var(--nav);font-weight:500}
.flt{font-size:13px;margin:0 0 14px;color:var(--text)}.flt a{margin:0 8px 0 4px}
.grp{font-size:15px;font-weight:500;margin:20px 0 10px;color:var(--text)}.grp small{font-weight:400;color:var(--sub);font-size:12px;margin-left:8px}
.act{background:var(--card);border:1px solid var(--line2);border-radius:4px;margin:0 0 10px}
.act .h{display:flex;gap:9px;align-items:center;padding:11px 14px;cursor:pointer;font-size:13.5px}
.act .h .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
.act .h .d{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap}
.act .h .tx b{font-weight:500}
.act .b{padding:2px 16px 14px 46px;font-size:13.5px;color:var(--text);border-top:0}
.act .b p{margin:6px 0}.act .b .m{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}.act .b .m div{font-size:12px;color:var(--sub)}.act .b .m b{display:block;font-size:18px;color:var(--teal);font-weight:500}
.act.task .h{padding-right:14px}.ck{width:16px;height:16px;border:1.5px solid var(--sub);border-radius:50%;flex:none;background:var(--card);display:grid;place-items:center;font-size:10px;color:#fff}.ck.on{background:var(--green);border-color:var(--green)}
.od{color:var(--red);font-size:12px}
.rc{border-bottom:1px solid var(--line2)}.rc .h{display:flex;align-items:center;gap:8px;padding:14px 18px;cursor:pointer;font-size:13.5px;font-weight:500}.rc .h .l{margin-left:auto;font-weight:400;font-size:13px}
.rc .b{padding:0 18px 14px 36px;font-size:13px}.rc .b div{padding:5px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.car{transition:transform .15s;display:inline-block}.car.open{transform:rotate(90deg)}
/* tickets */
.pg{padding:20px 28px 40px}
.ttl{display:flex;align-items:center;gap:12px;margin:0 0 18px;flex-wrap:wrap}.ttl h1{margin:0;font-size:26px;font-weight:400;color:var(--teal)}.ttl .sp{flex:1}
.vt{display:inline-flex}.vt button{border:1px solid var(--line);background:var(--card);width:34px;height:34px;display:grid;place-items:center;color:var(--sub)}.vt button.on{background:var(--soft);color:var(--text)}.vt button:first-child{border-radius:3px 0 0 3px}.vt button:last-child{border-radius:0 3px 3px 0;border-left:0}
.fl{display:flex;gap:10px;align-items:center;margin:0 0 14px;flex-wrap:wrap}.fl .srch{max-width:230px}
.fp{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:0 0 14px;display:flex;gap:14px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(45,62,80,.1)}
.fp label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.board{display:flex;background:var(--card);border:1px solid var(--line);overflow-x:auto;min-height:520px}
.bc{flex:1 1 0;min-width:240px;border-right:1px solid var(--line)}.bc:last-child{border-right:0}.bc.cl2{flex:0 0 54px;min-width:54px}
.bc .hd{background:var(--bg);border-bottom:1px solid var(--line);padding:11px 14px;font-size:12px;font-weight:500;color:var(--sub);display:flex;gap:8px;align-items:center;text-transform:uppercase;letter-spacing:.02em}
.bc .hd .n{margin-left:auto;display:flex;gap:4px;align-items:center;color:var(--sub)}
.bc .bd{padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.tk{border:1px solid var(--line);border-radius:3px;background:var(--card);padding:10px 12px;cursor:pointer;font-size:13px;box-shadow:0 1px 2px rgba(45,62,80,.06)}.tk:hover{box-shadow:0 4px 12px rgba(45,62,80,.16)}
.tk .tt{color:var(--link);font-weight:500;display:block;margin-bottom:5px;line-height:1.35}.tk .r{color:var(--text)}.tk .r b{font-weight:500}
.tk .flag{margin:-10px -12px 8px;padding:5px 12px;background:var(--soft);font-size:10.5px;letter-spacing:.04em;color:var(--sub);text-transform:uppercase}
.tk.fresh{animation:fresh 2.2s ease-out}@keyframes fresh{0%{box-shadow:0 0 0 3px var(--o)}100%{box-shadow:0 1px 2px rgba(45,62,80,.06)}}.tk .pr{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:4px;font-size:12px;color:var(--sub)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tbl{width:100%;background:var(--card);border:1px solid var(--line);border-collapse:collapse}.tbl th{background:var(--bg);text-align:left;font-size:12px;font-weight:500;color:var(--sub);padding:10px 14px;border-bottom:1px solid var(--line);text-transform:uppercase}.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);font-size:13.5px}.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--bg)}
.drawer{position:fixed;right:0;top:48px;bottom:0;width:min(560px,100%);background:var(--card);z-index:60;box-shadow:-8px 0 30px rgba(45,62,80,.22);overflow:auto}
.shade{position:fixed;left:0;right:0;top:48px;bottom:0;background:rgba(45,62,80,.3);z-index:59}
.drawer .dh{background:var(--nav);color:#fff;padding:16px 22px;position:sticky;top:0;z-index:2}.drawer .dh h2{margin:4px 40px 0 0;font-size:18px;font-weight:500;line-height:1.3}.drawer .dh small{opacity:.8;font-size:12px}
.dx{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:18px;display:grid;place-items:center}.dx:hover{background:rgba(255,255,255,.3)}
.dnav{display:flex;gap:8px;margin-top:10px}.dnav button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:3px;padding:4px 10px;font-size:12px}
.db{padding:18px 22px 40px}.db h5{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:500;margin:20px 0 8px}.db h5:first-child{margin-top:0}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}.pp div{font-size:13.5px}.pp b{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.km{display:flex;gap:10px;flex-wrap:wrap}.km div{border:1px solid var(--line2);border-radius:3px;padding:10px 14px;min-width:110px}.km b{display:block;font-size:22px;color:var(--teal);font-weight:500;line-height:1.1}.km span{font-size:12px;color:var(--sub)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.modal{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(45,62,80,.55);z-index:80;display:grid;place-items:center;padding:20px}
.dlg{background:var(--card);border-radius:4px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg .mh{background:var(--nav);color:#fff;padding:14px 20px;display:flex;align-items:center;font-size:16px;font-weight:500}.dlg .mh .dx{position:static;margin-left:auto}
.dlg .mb{padding:20px}.dlg label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px}.dlg input,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:9px 12px;font:inherit}.dlg textarea{min-height:110px}
.dlg .mf{padding:14px 20px;border-top:1px solid var(--line2);display:flex;gap:10px;background:var(--bg)}
.toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:var(--nav);color:#fff;border-radius:4px;padding:11px 20px 11px 16px;z-index:200;font-size:14px;box-shadow:0 8px 24px rgba(10,20,30,.35);border-left:4px solid var(--o);max-width:92vw}
.tip{position:fixed;z-index:95;background:var(--nav);color:#fff;border-radius:3px;padding:6px 10px;font-size:12px;pointer-events:none;max-width:260px}
.menu2{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 20px rgba(45,62,80,.2);z-index:40;min-width:200px;padding:6px 0}.menu2 a,.menu2 button{display:block;width:100%;text-align:left;padding:8px 16px;border:0;background:none;color:var(--text);font-size:13.5px}.menu2 a:hover,.menu2 button:hover{background:var(--bg);text-decoration:none}
.rel{position:relative;display:inline-block}
/* dashboards */
.dash{display:grid;grid-template-columns:1.25fr .7fr .7fr 1.35fr;gap:14px}
.dc{background:var(--card);border:1px solid var(--line2);border-radius:4px;padding:16px 18px;min-width:0}.dc h3{margin:0 0 12px;font-size:12.5px;font-weight:500;color:var(--text)}
.kpi{text-align:center}.kpi h3{text-align:left}.kpi .lb{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em}.kpi .nm{font-size:34px;color:var(--teal);font-weight:500;line-height:1.3;margin:6px 0 2px}.kpi .dl{font-size:12.5px;color:var(--sub)}.kpi .dl i{display:inline-block;border:5px solid transparent;border-bottom:8px solid var(--green);border-top:0;margin-right:5px}
.kpi.click{cursor:pointer}.kpi.click:hover{box-shadow:0 4px 14px rgba(45,62,80,.14)}
.leg{display:flex;flex-direction:column;gap:5px;font-size:12.5px;margin-top:10px}.leg div{display:flex;gap:8px;align-items:center;cursor:pointer}.leg i{width:10px;height:10px;border-radius:2px;flex:none}
.hb{display:flex;align-items:center;gap:10px;font-size:13px;margin:7px 0}.hb .l{width:150px;flex:none;color:var(--text)}.hb .t{flex:1;background:var(--soft);height:12px;border-radius:2px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--o)}.hb .v{width:26px;text-align:right;color:var(--sub)}
.sg{cursor:pointer}.sg:hover{opacity:.85}
.fun{display:flex;gap:0;align-items:stretch}.fun div{flex:1;background:var(--soft);padding:12px;text-align:center;font-size:12px;color:var(--sub);clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%,8% 50%)}.fun div:first-child{clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%)}.fun b{display:block;font-size:24px;color:var(--teal);font-weight:500}
/* workflows */
.wfh{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wfh h1{margin:0;font-size:18px;font-weight:500}.sw{width:34px;height:18px;border-radius:9px;background:var(--green);position:relative;display:inline-block}.sw::after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--card)}
.wtabs{background:var(--card);border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:4px}.wtabs button{border:0;background:none;padding:12px 16px;border-bottom:3px solid transparent;font-size:14px}.wtabs button.on{border-bottom-color:var(--o);font-weight:500}
.cv{position:relative;overflow:auto;background:var(--soft);background-image:radial-gradient(#d0dbe7 1px,transparent 1px);background-size:20px 20px;min-height:640px}
.cvi{position:relative;margin:0 auto}
.nd{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--text);box-shadow:0 1px 3px rgba(45,62,80,.1);transition:box-shadow .2s,border-color .2s}
.nd.a{border-top:4px solid var(--green);padding:10px 14px 8px;cursor:pointer;display:flex;flex-direction:column}.nd.a .tx{flex:1;overflow:hidden}.nd.a.partial{border-top-color:var(--amber)}.nd.a.ready{border-top-color:#7c98b6}
.nd .hh{display:flex;gap:8px;align-items:center;font-weight:500;font-size:12px;margin-bottom:8px}.nd .ib{width:24px;height:24px;border-radius:5px;background:#e5e8ff;color:#5a4fcf;display:grid;place-items:center;font-size:13px;flex:none}
.nd .tx{font-size:12px;line-height:1.45;min-height:34px}.nd .ft{display:flex;align-items:center;gap:10px;color:var(--sub);margin-top:8px;padding-top:8px;font-size:11px}.nd .ft a{margin-left:auto;font-size:12px}
.nd.t{border-radius:4px;padding:12px 14px;background:var(--soft);border-color:var(--line)}.nd.t .g{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:8px}
.nd.b{padding:12px 14px;border-radius:4px}.nd.l{display:grid;place-items:center;font-size:12px;border-radius:2px;text-align:center;padding:0 8px;cursor:pointer;background:var(--card)}.nd.l:hover{border-color:var(--o)}
.nd.e{display:grid;place-items:center;font-size:11px;border-radius:2px}
.nd.run{border-color:var(--o);box-shadow:0 0 0 3px rgba(255,122,89,.28)}.nd.l.pick{border-color:var(--o);background:var(--card)4f1}.nd.dim{opacity:.4}
.pl{position:absolute;width:22px;height:22px;border-radius:4px;background:var(--nav);color:#fff;display:grid;place-items:center;font-size:14px;line-height:1;z-index:3;cursor:pointer}
.cvi svg.ed{position:absolute;left:0;top:0;pointer-events:none}.cvi svg.ed path{fill:none;stroke:#7c98b6;stroke-width:1.6}.cvi svg.ed path.run{stroke:var(--o)!important;stroke-width:2.6!important}
.testp{position:absolute;right:16px;top:16px;width:300px;background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 22px rgba(45,62,80,.2);z-index:10;padding:14px 16px;font-size:13px}.testp h4{margin:0 0 8px;font-size:14px;font-weight:500}
.tr li{margin:4px 0;list-style:none}.tr{padding:0;margin:8px 0 0;max-height:240px;overflow:auto}
